# Builds the Mii Hub desktop app for Windows, Mac and Linux, then puts the
# installers on the repository's Releases page so they can be downloaded.
# Runs every time code is pushed (or when started by hand from the Actions tab).
name: Build desktop app

on:
  push:
    branches: [main, claude/magical-goodall-vsocgg]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Set version number
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # the app isn't code-signed

      - uses: actions/upload-artifact@v4
        with:
          name: mii-hub-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mii Hub 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            ## Download Mii Hub

            Pick the file for your computer from **Assets** below:

            | Computer | File |
            | --- | --- |
            | Windows | `Mii-Hub-Setup-1.0.${{ github.run_number }}.exe` |
            | Mac (Intel or Apple Silicon) | `Mii-Hub-1.0.${{ github.run_number }}-mac.dmg` |
            | Linux | `Mii-Hub-1.0.${{ github.run_number }}-linux.AppImage` |

            **Windows:** run the Setup file. If Windows says *"Windows protected your PC"*, click **More info** → **Run anyway** (this shows up because the app isn't signed with a paid certificate).

            **Mac:** open the .dmg and drag **Mii Hub** into **Applications**. The first time, right-click the app → **Open** → **Open**. If macOS says it's damaged or can't be opened, go to **System Settings → Privacy & Security** and click **Open Anyway**.

            **Linux:** make the file executable (`chmod +x Mii-Hub-*.AppImage`) and double-click it.
