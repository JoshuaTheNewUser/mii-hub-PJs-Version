# One-click setup of the Mii Hub Paintball server on Render (render.com), for
# people who don't want to run it on their own computer. See server/README.md.
services:
  - type: web
    name: mii-hub-paintball
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node paintball-server.js
    plan: free
    healthCheckPath: /
